<title id="title">Orestor river system — regional relationship diagram</title><desc id="desc">Schematic relationships of the independent Calm and Red rivers. Klikatic joins Calm upstream of Orestor. The Red divides into a northern sea arm and eastern bay arm. A legendary breach links the bay to the eastern ocean. Distances, coastlines and national boundaries are provisional.</desc>
