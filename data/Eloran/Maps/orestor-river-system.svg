<text x="50" y="871" class="legend" >READING THE DIAGRAM</text>
<text x="50" y="903" class="small" >Klidná + Klikatic → Orestor → sea. The Red River reaches the same coastal system independently, through two arms.</text>
<text x="50" y="930" class="note" >The eastern breach connects the bay to the ocean; the bay itself stays broad. Names and alleged Orion origin remain tentative.</text>
