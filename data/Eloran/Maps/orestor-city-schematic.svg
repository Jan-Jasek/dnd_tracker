<title id="title">Orestor: Ores and Tor — working city schematic</title><desc id="desc">Candidate city layout. Ores stands on the west bank beneath the Sky District cliff. Larger Tor spreads across bridged river channels to the east and south. Numbered sites and hideout options are proposals; no travel scale is fixed.</desc>
